name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version

      - name: Build iOS Application
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ios/TechGolf.xcodeproj \
            -scheme TechGolf \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log

      - name: Capture and report build errors
        if: failure()
        run: |
          echo "### ❌ XcodeBuild Failure Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -C 2 "error:" xcodebuild.log | head -n 80 >> $GITHUB_STEP_SUMMARY || true
          tail -n 60 xcodebuild.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          while IFS= read -r line; do
            if [[ "$line" == *"error:"* ]]; then
              echo "::error::$line"
            fi
          done < xcodebuild.log

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r TechGolf.ipa Payload
          echo "Successfully created TechGolf.ipa"
          ls -la TechGolf.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechGolf-IPA
          path: TechGolf.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-ios
          name: "TechGolf iOS v1.0.0 (iOS 16+)"
          body: "TechGolf Native Swift iOS v1.0.0 IPA build compatible with iOS 16.0+ (iPhone 8 Plus, iPhone X, iPhone 11-16). Direct guest mode enabled with Supabase online database integration."
          files: TechGolf.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
